<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="../../src/style/game.css">
	<link rel="stylesheet" href="../../src/style/lesson.css">
	<link rel="stylesheet" href="../../src/style/cube.css">
</head>

<body>


	<div class="container">
		<main>
			<header>

				<div>
					<a href="./index.html">
						<p class="x">x</p>
					</a>
					<div class="barContainer">
						<p class="text-bar">1/10 Questions</p>
						<div class="bar">
							<div class="barFill"></div>
						</div>
					</div>
				</div>

			</header>

			<section id="main">

				<div class="dialogContainer">
					<div class="icon"></div>
					<div class="dialog">
						<p></p>
					</div>
				</div>

				<div class="contentContainer">

					<div class="output">

						<div class="content grid-5">
							<h1 class="text-center blue">5</h1>

							<h1 class="text-center">+</h1>

							<h1 class="eqn text-center yellow">5</h1>

							<h1 class="text-center">=</h1>

							<h1 class="text-center eqn"></h1>
						</div>
						<div class="cube">
							<div class="face frontt">
								<h1>10</h1>
							</div>
							<div class="face backk">
								<h1>9</h1>
							</div>
							<div class="face leftt">
								<h1>8</h1>
							</div>
							<div class="face rightt">
								<h1>7</h1>
							</div>
							<div class="face topp">
								<h1>6</h1>
							</div>
							<div class="face bottomm">
								<h1>5</h1>
							</div>
						</div>

						<div class="content grid-4 gap-1">
							<div class="option soft-box btnAns">
								<h2>&LeftArrow;</h2>
							</div>
							<div class="option soft-box btnAns">
								<h2>&UpArrow;</h2>
							</div>
							<div class="option soft-box btnAns">
								<h2>&downarrow;</h2>
							</div>
							<div class="option soft-box btnAns">
								<h2>&rightarrow;</h2>
							</div>
						</div>

					</div>

				</div>

			</section>

			<footer>
				<div class="textContainer textBetul">
					<h2 class="hidden">BETUL</h2>
					<p class="hidden textFooter"></p>
				</div>
				<div class="btnContainer">
					<button class="btnContinue soft-box hidden">CONTINUE</button>
					<button class="btnCheck soft-box ">CHECK</button>
					<button class="btnBack soft-box hidden">BACK</button>
					<button class="btnNext soft-box hidden">NEXT</button>
				</div>
			</footer>
		</main>
	</div>

	<script type="module">
		// import { json } from "../../src/js/data/lessonData6.js"
		// import { runComponents } from "../../src/js/core/componentRunner.js"
		// runComponents(json)
	</script>

</body>

</html>
