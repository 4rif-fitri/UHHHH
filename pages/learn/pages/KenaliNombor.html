<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="../../../src/style/game.css">
	<link rel="stylesheet" href="../../../src/style/lesson.css">
	<link rel="stylesheet" href="../../../src/style/quiz.css">
	<link rel="stylesheet" href="../../../src/style/layoutContent.css">
	<link rel="stylesheet" href="../../../src/style/cube.css">

	<style>
		.cubes-container {
			justify-content: center;
			display: grid;
			gap: 2rem;
			grid-template-columns: repeat(5, 1fr);
		}

		.cubes-container .cube {
			rotate: -90deg;
			scale: 1.25;
		}

		.textHuruf {
			border-top: 5px dashed black;
			border-bottom: 5px dashed black;
			margin-top: 2rem;
			display: flex;
			width: 50%;
			justify-content: center;
			align-items: center;
			gap: 1.5rem;
		}

		.textHuruf>h1 {
			font-size: 10rem;
		}

		.textHuruf article {
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		.textHuruf article h2 {
			font-size: 2.5rem;
		}

		.count {
			rotate: 90deg;
			position: absolute;
			top: 50%;
			left: 50%;
			background-color: #fff;
			width: 30px;
			height: 30px;
			transform: translate(-50%, 50%);
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			pointer-events: none;
		}

		.cube:hover {
			cursor: unset;
		}

		@media (max-width: 520px) {
			.cubes-container {
				grid-template-columns: repeat(3, 1fr);
			}

			.cubes-container {
				gap: 1rem;
			}

			.cubes-container .cube {
				rotate: -90deg;
				scale: 1;
			}

			.textHuruf>h1 {
				font-size: 6rem;
			}

			.textHuruf article h2 {
				font-size: 1.5rem;
			}
		}
	</style>
</head>

<body>

	<div class="container">
		<main>
			<header>

				<div>
					<a href="./index.html">
						<p class="x">x</p>
					</a>
					<div class="barContainer">
						<p class="text-bar">1/10 Questions</p>
						<div class="bar">
							<div class="barFill"></div>
						</div>
					</div>
				</div>

			</header>

			<section id="main">

				<div class="dialogContainer">
					<div class="icon"></div>
					<div class="dialog">
						<p></p>
					</div>
				</div>

				<div class="contentContainer">

					<div class="output">

						<div class="kecil-besar">
							<p>Kecil</p>
							<div class="arrow"></div>
							<p>Besar</p>
						</div>

						<div class="container-drop-susun">

							<div class="box-drop-susun"></div>
							<div class="box-drop-susun"></div>
							<div class="box-drop-susun"></div>
							<div class="box-drop-susun"></div>
							<div class="box-drop-susun"></div>

						</div>

						<h3>Seret kad ke ruang kosong</h3>
						<div class="container-kad-susun">

							<div class="box-drag-susun" data-value="1">1</div>
							<div class="box-drag-susun" data-value="3">3</div>
							<div class="box-drag-susun" data-value="2">2</div>
							<div class="box-drag-susun" data-value="5">5</div>
							<div class="box-drag-susun" data-value="4">4</div>

						</div>

					</div>

				</div>

			</section>

			<footer>
				<div class="textContainer textBetul">
					<h2 class="hidden">BETUL</h2>
					<p class="hidden textFooter"></p>
				</div>
				<div class="btnContainer">
					<button class="btnContinue soft-box hidden">CONTINUE</button>
					<button class="btnCheck soft-box">CHECK</button>
					<button class="btnBack soft-box hidden">BACK</button>
					<button class="btnNext soft-box hidden">NEXT</button>
				</div>
			</footer>
		</main>
	</div>

	<script type="module">

		// import { json } from "../../../src/js/data/lessonDataKenaliNombor.js"
		// import { runComponents } from "../../../../src/js/core/componentRunner.js"
		// runComponents(json)

		const tray = document.querySelector(".container-kad-susun");
		const btnCheck = document.querySelector(".btnCheck");
		const dialog = document.querySelector(".dialog p");

		let dragState = null;
		let isLocked = false;

		function clearHighlight() {
			document.querySelectorAll(".drop-active")
				.forEach(element => {
					element.classList.remove("drop-active");
				});
		}

		function findDropTarget(x, y) {
			const element = document.elementFromPoint(x, y);

			if (!element) return null;

			const slot = element.closest(".box-drop-susun");

			if (
				slot &&
				!slot.querySelector(".box-drag-susun")
			) {
				return slot;
			}

			return element.closest(".container-kad-susun");
		}

		function startDrag(event) {
			if (isLocked || event.button !== 0) return;

			const card = event.target.closest(".box-drag-susun");

			if (!card) return;

			event.preventDefault();

			const rect = card.getBoundingClientRect();

			dragState = {
				card,
				pointerId: event.pointerId,
				offsetX: event.clientX - rect.left,
				offsetY: event.clientY - rect.top,
				originalParent: card.parentElement,
				originalNextSibling: card.nextElementSibling,
				dropTarget: null
			};

			card.classList.add("dragging");

			Object.assign(card.style, {
				position: "fixed",
				left: `${rect.left}px`,
				top: `${rect.top}px`,
				width: `${rect.width}px`,
				height: `${rect.height}px`,
				margin: "0",
				pointerEvents: "none",
				zIndex: "9999"
			});

			document.body.appendChild(card);
		}

		function moveDrag(event) {
			if (
				!dragState ||
				event.pointerId !== dragState.pointerId
			) {
				return;
			}

			const { card, offsetX, offsetY } = dragState;

			card.style.left =
				`${event.clientX - offsetX}px`;

			card.style.top =
				`${event.clientY - offsetY}px`;

			clearHighlight();

			const target = findDropTarget(
				event.clientX,
				event.clientY
			);

			dragState.dropTarget = target;
			target?.classList.add("drop-active");
		}

		function returnCard() {
			const {
				card,
				originalParent,
				originalNextSibling
			} = dragState;

			if (
				originalNextSibling &&
				originalNextSibling.parentElement === originalParent
			) {
				originalParent.insertBefore(
					card,
					originalNextSibling
				);
			} else {
				originalParent.appendChild(card);
			}
		}

		function clearDragStyle(card) {
			card.classList.remove("dragging");

			card.style.position = "";
			card.style.left = "";
			card.style.top = "";
			card.style.width = "";
			card.style.height = "";
			card.style.margin = "";
			card.style.pointerEvents = "";
			card.style.zIndex = "";
		}

		function endDrag(event) {
			if (
				!dragState ||
				event.pointerId !== dragState.pointerId
			) {
				return;
			}

			const { card, dropTarget } = dragState;

			clearHighlight();

			if (
				dropTarget?.classList.contains(
					"box-drop-susun"
				)
			) {
				dropTarget.appendChild(card);
			} else if (
				dropTarget?.classList.contains(
					"container-kad-susun"
				)
			) {
				tray.appendChild(card);
			} else {
				returnCard();
			}

			clearDragStyle(card);
			dragState = null;
		}

		function checkAnswer() {
			const slots = [
				...document.querySelectorAll(
					".box-drop-susun"
				)
			];

			const selectedValues = slots.map(slot => {
				const card = slot.querySelector(
					".box-drag-susun"
				);

				return card
					? Number(card.dataset.value)
					: null;
			});

			if (selectedValues.includes(null)) {
				dialog.textContent =
					"Isi semua ruang terlebih dahulu.";
				return;
			}

			const correctAnswer = [1, 2, 3, 4, 5];

			const isCorrect = selectedValues.every(
				(value, index) =>
					value === correctAnswer[index]
			);

			if (isCorrect) {
				isLocked = true;

				dialog.textContent =
					"Betul! Susunan nombor tepat.";

				dialog.style.color = "#22a000";

				btnCheck.classList.add("hidden");

				document
					.querySelector(".btnContinue")
					.classList.remove("hidden");
			} else {
				dialog.textContent =
					"Susunan salah. Cuba lagi!";

				dialog.style.color = "#e53935";
			}
		}

		document.addEventListener(
			"pointerdown",
			startDrag
		);

		document.addEventListener(
			"pointermove",
			moveDrag
		);

		document.addEventListener(
			"pointerup",
			endDrag
		);

		document.addEventListener(
			"pointercancel",
			endDrag
		);

		btnCheck.addEventListener(
			"click",
			checkAnswer
		);

	</script>

</body>

</html>
