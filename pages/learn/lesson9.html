<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="../../src/style/game.css">
	<link rel="stylesheet" href="../../src/style/lesson.css">
	<link rel="stylesheet" href="../../src/style/cube.css">
	<link rel="stylesheet" href="../../src/style/layoutContent.css">
	<style>
		.output {}

		.group1-container,
		.group2-container {
			width: 100%;
			padding: 0.5rem;
			display: flex;
			flex-direction: column;
		}

		.group2-container {
			display: flex;
			align-items: end !important;
		}

		.group1-container>div,
		.group2-container>div {
			display: flex;
		}


		.merge-group {
			display: flex;
			flex-direction: column;
		}

		.merge {
			display: flex;
		}

		.output-wrapper {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.cube-target.active {
			background: rgba(88, 204, 2, 0.2);
			border-color: #58cc02;
			transform: scale(1.08);
		}

		.flying-counter {
			position: fixed !important;
			z-index: 9999;

			margin: 0 !important;
			pointer-events: none;

			background: #8b5cf6;
			border: 3px solid #6d28d9;
			box-shadow: 0 8px 15px rgba(0, 0, 0, 0.25);

			will-change: transform;
		}

		.cube-target>.cube {
			width: 100%;
			height: 100%;
			box-sizing: border-box;
		}
	</style>
</head>

<body>
	<div class="container">
		<main>
			<header>
				<div>
					<a href="./index.html">
						<p class="x">x</p>
					</a>
					<div class="barContainer">
						<p class="text-bar">1/10 Questions</p>
						<div class="bar">
							<div class="barFill"></div>
						</div>
					</div>
				</div>

			</header>

			<section id="main">

				<div class="dialogContainer">
					<div class="icon"></div>
					<div class="dialog">
						<p></p>
					</div>
				</div>

				<div class="contentContainer">


				</div>

			</section>

			<footer>
				<div class="textContainer textBetul">
					<h2 class="hidden">BETUL</h2>
					<p class="hidden textFooter"></p>
				</div>
				<div class="btnContainer grid-2">
					<button class="btnContinue soft-box hidden">CONTINUE</button>
					<button class="btnCheck soft-box hidden">CHECK</button>
					<button class="btnBack soft-box">BACK</button>
					<button class="btnNext soft-box">NEXT</button>
				</div>
			</footer>
		</main>
	</div>

	<script type="module">
		import { json } from "../../src/js/data/lessonDataGabungKumpulan.js"
		import { runComponents } from "../../src/js/core/componentRunner.js"
		runComponents(json)
	</script>

</body>

</html>
