	<script type="module">
		// import { json } from "../../src/js/data/lessonData6.js"
		// import { runComponents } from "../../src/js/core/componentRunner.js"
		// runComponents(json)

		let TARGET = 7;
		let frame = document.querySelector(".ten-frame");
		let tray = document.querySelector(".cube-tray");
		let speaker = document.querySelector(".speaker");
		let dragState = null;

		function clearDropHighlight() {
			document.querySelectorAll(".drop-active")
				.forEach(element => element.classList.remove("drop-active")
				);
		}

		function clearDragStyle(cube) {
			cube.classList.remove("dragging");
			cube.style.position = "";
			cube.style.left = "";
			cube.style.top = "";
			cube.style.width = "";
			cube.style.height = "";
			cube.style.margin = "";
			cube.style.pointerEvents = "";
		}

		function findDropTarget(x, y) {
			let element = document.elementFromPoint(x, y);

			if (!element) {
				return null;
			}

			let slot = element.closest(".slot");

			if (slot && !slot.querySelector(".cube")) {
				return slot;
			}

			return element.closest(".cube-tray");
		}

		function startDrag(event) {
			let cube = event.target.closest(".cube");

			if (!cube || event.button > 0) return

			event.preventDefault();

			let rect = cube.getBoundingClientRect();
			let originalParent = cube.parentElement;
			let originalNextSibling = cube.nextElementSibling;

			if (originalParent.classList.contains("slot")) {
				originalParent.classList.remove("filled");
			}

			dragState = {
				cube,
				pointerId: event.pointerId,
				offsetX: event.clientX - rect.left,
				offsetY: event.clientY - rect.top,
				originalParent,
				originalNextSibling,
				dropTarget: null
			};

			cube.classList.add("dragging");
			cube.style.position = "fixed";
			cube.style.left = `${rect.left}px`;
			cube.style.top = `${rect.top}px`;
			cube.style.width = `${rect.width}px`;
			cube.style.height = `${rect.height}px`;
			cube.style.margin = "0";
			cube.style.pointerEvents = "none";

			document.body.appendChild(cube);
			cube.setPointerCapture?.(event.pointerId);
		}

		function moveDrag(event) {
			if (!dragState || event.pointerId !== dragState.pointerId) return

			let { cube, offsetX, offsetY } = dragState;

			cube.style.left = `${event.clientX - offsetX}px`;
			cube.style.top = `${event.clientY - offsetY}px`;

			clearDropHighlight();

			let target = findDropTarget(event.clientX, event.clientY);

			dragState.dropTarget = target;
			target?.classList.add("drop-active");
		}

		function returnToOriginalPosition() {
			let { cube, originalParent, originalNextSibling } = dragState;

			if (originalNextSibling && originalNextSibling.parentElement === originalParent) {
				originalParent.insertBefore(cube, originalNextSibling);

			} else {
				originalParent.appendChild(cube);
			}

			if (originalParent.classList.contains("slot")) {
				originalParent.classList.add("filled");
			}
		}

		function endDrag(event) {
			if (!dragState || event.pointerId !== dragState.pointerId) return

			let { cube, dropTarget } = dragState;

			clearDropHighlight();

			if (dropTarget?.classList.contains("slot")) {
				dropTarget.appendChild(cube);
				dropTarget.classList.add("filled");

			} else if (dropTarget?.classList.contains("cube-tray")) {
				tray.appendChild(cube);

			} else {
				returnToOriginalPosition();
			}

			clearDragStyle(cube);
			dragState = null;

		}

		document.addEventListener("pointerdown", startDrag);
		document.addEventListener("pointermove", moveDrag);
		document.addEventListener("pointerup", endDrag);
		document.addEventListener("pointercancel", endDrag);

		document.querySelector(".reset").addEventListener("click", () => {
			document.querySelectorAll(".slot .cube").forEach(cube => {
				let slot = cube.closest(".slot");
				slot.classList.remove("filled");
				tray.appendChild(cube);
			});

		});

	</script>
