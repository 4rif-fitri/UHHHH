<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/src/stylee/lesson-app.css">

	<style>
		.pwp-wrapper {
			width: min(700px, 100%);
			min-height: 430px;
			margin: auto;

			display: grid;
			grid-template-columns: 1.2fr 1fr;
			grid-template-rows: 1fr auto;
			gap: 1rem;

			align-items: stretch;
		}

		/* WHOLE BESAR SEBELAH KIRI */
		.pwp-whole {
			grid-column: 1;
			grid-row: 1;

			padding: 1.25rem;

			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;

			background: #ffec9d;
			border: 4px solid #f28c00;
			border-radius: 25px;
		}

		.pwp-whole h2,
		.pwp-part h2 {
			margin: 0 0 0.75rem;

			color: #0876cb;
			text-align: center;
		}

		/* Kumpulan Lego dalam Whole */
		.whole-group {
			width: 100%;
			min-height: 110px;

			display: flex;
			flex-direction: row;
			align-items: center;
			justify-content: center;
		}

		.whole-group+.whole-group {
			margin-top: 0.75rem;
		}

		/* DUA PART DI KANAN */
		.pwp-parts {
			grid-column: 2;
			grid-row: 1;

			display: grid;
			grid-template-rows: repeat(2, 1fr);
			gap: 0.75rem;
		}

		.pwp-part {
			padding: 1rem;

			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;

			background: #a8d8f7;
			border: 4px solid #0876cb;
			border-radius: 22px;

			animation: partShow 0.45s ease;
		}

		.part-cubes {
			width: 100%;

			display: flex;
			flex-direction: row;
			align-items: center;
			justify-content: center;
			flex-wrap: wrap;
		}

		.pwp-part p,
		.whole-count {
			margin: 0.5rem 0 0;

			color: #0876cb;
			font-size: 1.1rem;
			font-weight: bold;
		}

		/* Reset Lego supaya mendatar */
		.pwp-wrapper .cube {
			width: 60px !important;
			height: 60px !important;

			position: relative !important;
			flex: 0 0 60px;

			rotate: 0deg !important;
			scale: 1 !important;
			transform: none !important;

			margin: 0 !important;
		}

		/* Lego biru */
		.pwp-wrapper .cube-blue,
		.pwp-wrapper .cube-blue::before,
		.pwp-wrapper .cube-blue::after {
			background-color: #4ca8f0 !important;
			border-color: #0876cb !important;
		}

		/* Lego merah */
		.pwp-wrapper .cube-red,
		.pwp-wrapper .cube-red::before,
		.pwp-wrapper .cube-red::after {
			background-color: #ffaaaa !important;
			border-color: #ff3030 !important;
		}

		/* Rumusan bawah */
		.pwp-summary {
			grid-column: 1 / -1;
			grid-row: 2;

			padding: 0.65rem 1rem;

			text-align: center;

			background: #dcfce7;
			border: 3px solid #58cc02;
			border-radius: 14px;

			animation: partShow 0.45s ease;
		}

		.pwp-summary h2 {
			margin: 0;
			color: #249b48;
		}

		@keyframes partShow {
			from {
				opacity: 0;
				transform: translateX(20px);
			}

			to {
				opacity: 1;
				transform: translateX(0);
			}
		}

		@media (max-width: 520px) {
			.pwp-wrapper {
				min-height: 370px;
				grid-template-columns: 1.15fr 1fr;
				gap: 0.5rem;
			}

			.pwp-whole {
				padding: 0.5rem;
				border-radius: 15px;
			}

			.pwp-parts {
				gap: 0.5rem;
			}

			.pwp-part {
				padding: 0.5rem;
				border-radius: 15px;
			}

			.pwp-wrapper .cube {
				width: 40px !important;
				height: 40px !important;
				flex-basis: 40px;
			}

			.whole-group {
				min-height: 80px;
			}

			.pwp-part p,
			.whole-count {
				font-size: 0.8rem;
			}
		}
	</style>
</head>

<body>
	<div class="container">
		<main>
			<header>
				<div>
					<a href="./index.html">
						<p class="x">x</p>
					</a>
					<div class="barContainer">
						<p class="text-bar">1/10 Questions</p>
						<div class="bar">
							<div class="barFill"></div>
						</div>
					</div>
				</div>

			</header>

			<section id="main">

				<div class="dialogContainer">
					<div class="icon"></div>
					<div class="dialog">
						<p></p>
					</div>
				</div>

				<div class="contentContainer">


				</div>

			</section>

			<footer>
				<div class="textContainer textBetul">
					<h2 class="hidden">BETUL</h2>
					<p class="hidden textFooter"></p>
				</div>
				<div class="btnContainer grid-2">
					<button class="btnContinue soft-box hidden">CONTINUE</button>
					<button class="btnCheck soft-box hidden">CHECK</button>
					<button class="btnBack soft-box">BACK</button>
					<button class="btnNext soft-box">NEXT</button>
				</div>
			</footer>
		</main>
	</div>

	<script type="module">
		import { json } from "../../src/js/data/lessonDataGabungPartWhole.js"
		import { runComponents } from "../../src/js/core/componentRunner.js"
		runComponents(json)
	</script>

</body>

</html>
