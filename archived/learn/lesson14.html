<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="/src/stylee/lesson-app.css">

	<style>
		.group1-container,
		.group2-container {
			width: 100%;
			padding: 0.5rem;
			display: flex;
			flex-direction: column;
		}

		.group2-container {
			display: flex;
			align-items: end !important;
		}

		.group1-container>div,
		.group2-container>div {
			display: flex;
		}


		.merge-group {
			display: flex;
			flex-direction: column;
		}

		.merge {
			display: flex;
		}

		.output-wrapper {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.cube-target.active {
			background: rgba(88, 204, 2, 0.2);
			border-color: #58cc02;
			transform: scale(1.08);
		}

		.flying-counter {
			position: fixed !important;
			z-index: 9999;

			margin: 0 !important;
			pointer-events: none;

			background: #8b5cf6;
			border: 3px solid #6d28d9;
			box-shadow: 0 8px 15px rgba(0, 0, 0, 0.25);

			will-change: transform;
		}

		.cube-target>.cube {
			width: 100%;
			height: 100%;
			box-sizing: border-box;
		}

		.focus-group {
			background: #fff7cc;
			border: 3px solid #ffc928;
			border-radius: 14px;
			transform: scale(1.02);
		}

		.cube-number {
			opacity: 0;
			pointer-events: none;
		}

		.cube.counting .cube-number,
		.cube.counted .cube-number {
			opacity: 1;
		}

		.cube.counting {
			z-index: 10;
			color: white;

			animation: countCube 0.5s ease;
		}

		.cube.counted {
			z-index: 1000;
			color: white;
			background: #58cc02;
			border-color: #46a302;
		}

		.cube.counted {
			background: linear-gradient(145deg, var(--color-primary), var(--color-primary-dark));
			border: 3px solid var(--color-primary-dark);
			box-shadow:
				0 5px 0 var(--color-primary-dark),
				0 8px 12px rgba(0, 0, 0, 0.2);
		}

		.cube.counted::before {
			background: var(--color-primary-dark);
			border: 2px solid var(--color-primary-dark);
			box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.18);
		}

		.cube.counted::after {
			background: var(--color-primary-dark);
			border: 2px solid var(--color-primary-dark);
		}

		@keyframes countCube {
			0% {
				transform: scale(1);
			}

			50% {
				transform: scale(1.5);
			}

			100% {
				transform: scale(1);
			}
		}

		.equation {
			opacity: 0;
			transform: translateY(15px);
			transition: 0.4s ease;
		}

		.equation.show {
			opacity: 1;
			transform: translateY(0);
		}

		.delete-container {
			padding: 0.75rem;
			border: 3px solid transparent;
			border-radius: 14px;

			display: flex;
			flex-direction: column;
			align-items: flex-end;

			transition: 0.3s ease;
		}

		.deleteFrame {
			display: flex;
			gap: 0.5rem;
		}

		.delete-target {
			width: 55px;
			height: 55px;

			position: relative;

			display: grid;
			place-items: center;

			background: #fee2e2;
			border: 3px dashed #ef4444;
			border-radius: 9px;

			transition: 0.25s ease;
		}

		.delete-target.active {
			background: #fecaca;
			border-color: #dc2626;
			transform: scale(1.1);
		}

		.delete-icon {
			position: absolute;

			color: #ef4444;
			font-size: 2rem;
			font-weight: bold;

			opacity: 0.25;
			pointer-events: none;
		}

		.delete-target>.cube {
			width: 100%;
			height: 100%;
			z-index: 2;
		}

		.focus-delete {
			background: #fee2e2;
			border-color: #ef4444;
			transform: scale(1.02);
		}

		.cube.deleting {
			animation: deleteCube 0.35s ease forwards;
		}

		@keyframes deleteCube {
			0% {
				opacity: 1;
				transform: scale(1) rotate(0deg);
			}

			100% {
				opacity: 0;
				transform: scale(0) rotate(180deg);
			}
		}

		.cube-number {
			opacity: 0;
		}

		.cube.counting .cube-number,
		.cube.counted .cube-number {
			opacity: 1;
		}

		.cube.counting {
			background: #58cc02;
			border-color: #46a302;

			animation: countCube 0.5s ease;
		}

		.cube.counted {
			color: white;
			background: #58cc02;
			border-color: #46a302;
		}

		@keyframes countCube {
			0% {
				transform: scale(1);
			}

			50% {
				transform: scale(1.5);
			}

			100% {
				transform: scale(1);
			}
		}

		.equation {
			opacity: 0;
			transform: translateY(15px);
			transition: 0.4s ease;
		}

		.equation.show {
			opacity: 1;
			transform: translateY(0);
		}

		.tolak-pilih-lego {
			width: 100%;

			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 2rem;
		}

		.lego-container {
			width: 100%;

			display: flex;
			justify-content: center;
			flex-wrap: wrap;
			gap: 0.5rem;
		}

		.lego-remove {
			width: 70px;
			height: 70px;

			position: relative;

			background: #55b7f3;
			border: 4px solid #2384c2;
			border-radius: 12px;

			box-shadow:
				0 6px 0 #176a9e,
				inset 0 3px 0 rgba(255, 255, 255, 0.3);

			cursor: pointer;
			transition: 0.25s ease;
		}

		.lego-remove:hover {
			transform: translateY(-4px);
		}

		.remove-symbol {
			position: absolute;
			inset: 0;

			display: grid;
			place-items: center;

			color: white;
			font-size: 3rem;
			font-weight: bold;

			opacity: 0;
			transform: scale(0);

			transition: 0.25s ease;
		}

		.lego-remove.selected-remove {
			background: #ff7b7b;
			border-color: #ef4444;

			box-shadow:
				0 6px 0 #c62828,
				inset 0 3px 0 rgba(255, 255, 255, 0.3);

			transform: scale(0.9);
			opacity: 0.75;
		}

		.lego-remove.selected-remove .remove-symbol {
			opacity: 1;
			transform: scale(1);
		}

		.tolak-equation {
			display: grid;
			grid-template-columns:
				80px 45px 80px 45px 80px;

			align-items: center;
			justify-content: center;
			gap: 0.5rem;
		}

		.tolak-equation>h1 {
			text-align: center;
		}

		.number-box {
			width: 80px;
			height: 80px;

			display: grid;
			place-items: center;

			border: 4px solid;
			border-radius: 10px;

			font-size: 2rem;
			font-weight: bold;
		}

		.total-box {
			color: #16803b;
			background: #dcfce7;
			border-color: #22c55e;
		}

		.remove-box {
			color: #b91c1c;
			background: #fee2e2;
			border-color: #ef4444;
		}

		.answer-box {
			color: #173b72;
			background: #f8fafc;
			border-color: #64748b;
		}

		.answer-section {
			width: 100%;
			text-align: center;
		}

		.answer-section .options {
			width: 100%;

			display: grid;
			grid-template-columns:
				repeat(auto-fit,
					minmax(100px, 1fr));

			gap: 1rem;
		}

		.btnAns.selected {
			color: #0b2f68;
			background: #dbeafe;
			border-color: #3b82f6;
		}

		.btnAns.wrong {
			color: #991b1b;
			background: #fee2e2;
			border-color: #ef4444;
		}

		.btnAns.matched {
			color: #166534;
			background: #dcfce7;
			border-color: #22c55e;
		}

		@media (max-width: 520px) {
			.lego-remove {
				width: 52px;
				height: 52px;
			}

			.tolak-equation {
				grid-template-columns:
					55px 30px 55px 30px 55px;

				gap: 0.25rem;
			}

			.number-box {
				width: 55px;
				height: 55px;
			}
		}

		.pilih-ayat-tambah {
			width: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 4rem;
		}

		.cube-equation {
			display: flex;
			justify-content: center;
		}

		.cube-row {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.ayat-cube {
			width: 75px;
			height: 75px;
			position: relative;

			display: grid;
			place-items: center;

			border-radius: 8px;
			border: 3px solid;
			box-shadow:
				inset 0 -7px 0 rgb(0 0 0 / 10%),
				4px 5px 0 rgb(0 0 0 / 12%);
		}

		.cube-group-one {
			background: #d65ae8;
			border-color: #b93bce;
		}

		.cube-group-two {
			background: #00a847;
			border-color: #008437;
		}

		.cube-circle {
			width: 38px;
			height: 38px;

			border-radius: 50%;
			background: rgb(0 0 0 / 8%);

			box-shadow:
				inset 0 4px 4px rgb(0 0 0 / 12%);
		}

		.options {
			width: min(650px, 100%);
			gap: 1.5rem;
		}

		.btnAns {
			min-height: 80px;
			transition:
				transform 0.2s ease,
				background-color 0.2s ease;
		}

		.btnAns.selected {
			background: #dbeafe;
			border-color: #2196f3;
			transform: translateY(-5px);
		}

		.btnAns.matched {
			color: white;
			background: #58cc02;
			border-color: #46a302;
		}

		.btnAns.wrong {
			color: white;
			background: #ff4b4b;
			border-color: #d93636;
			animation: answerShake 0.35s ease;
		}

		@keyframes answerShake {
			25% {
				transform: translateX(-8px);
			}

			50% {
				transform: translateX(8px);
			}

			75% {
				transform: translateX(-5px);
			}
		}

		@media (max-width: 520px) {
			.pilih-ayat-tambah {
				gap: 2.5rem;
			}

			.ayat-cube {
				width: 55px;
				height: 55px;
			}

			.cube-circle {
				width: 28px;
				height: 28px;
			}

			.options {
				grid-template-columns: 1fr;
			}

			.btnAns {
				min-height: 65px;
			}
		}
	</style>
</head>

<body>
	<div class="container">
		<main>
			<header>
				<div>
					<a href="./index.html">
						<p class="x">x</p>
					</a>
					<div class="barContainer">
						<p class="text-bar">1/10 Questions</p>
						<div class="bar">
							<div class="barFill"></div>
						</div>
					</div>
				</div>

			</header>

			<section id="main">

				<div class="dialogContainer">
					<div class="icon"></div>
					<div class="dialog">
						<p></p>
					</div>
				</div>

				<div class="contentContainer">


				</div>

			</section>

			<footer>
				<div class="textContainer textBetul">
					<h2 class="hidden">BETUL</h2>
					<p class="hidden textFooter"></p>
				</div>
				<div class="btnContainer grid-2">
					<button class="btnContinue soft-box hidden">CONTINUE</button>
					<button class="btnCheck soft-box hidden">CHECK</button>
					<button class="btnBack soft-box">BACK</button>
					<button class="btnNext soft-box">NEXT</button>
				</div>
			</footer>
		</main>
	</div>

	<script type="module">
		import { json } from "../../src/js/data/lessonDataPilihAyatTambah.js"
		import { runComponents } from "../../src/js/core/componentRunner.js"
		runComponents(json)
	</script>

</body>

</html>
