<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="../../src/style/game.css">
	<link rel="stylesheet" href="../../src/style/lesson.css">
	<link rel="stylesheet" href="../../src/style/cube.css">
	<link rel="stylesheet" href="../../src/style/layoutContent.css">
	<style>
.gpw-wrapper {
	--green: #249b48;

	width: min(750px, 100%);
	min-height: 430px;
	margin: auto;

	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
}

/* Dua bahagian di atas */
.gpw-parts {
	width: 100%;

	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 4rem;
}

.gpw-part {
	display: flex;
	flex-direction: column;
	align-items: center;

	text-align: center;
}

.gpw-part h2,
.gpw-whole h2 {
	margin: 0 0 0.75rem;
	color: #0876cb;
}

.part-count {
	margin: 0.5rem 0 0;

	color: #0876cb;
	font-size: 1.3rem;
	font-weight: bold;
}

/* Kotak biru */
.gpw-box {
	width: 100%;
	min-height: 125px;
	padding: 1.25rem;

	display: grid;
	place-items: center;

	background: #a8d8f7;
	border: 3px solid var(--green);
	border-radius: 4px;
}

/* Susunan Lego */
.gpw-cube-row {
	display: flex;
	align-items: center;
	justify-content: center;
}

/* Lego asal daripada cube.css */
.gpw-cube-row .cube {
	flex-shrink: 0;

	rotate: -90deg;
	scale: 0.85;

	margin-inline: -6px;
}

/* Kumpulan pertama */
.gpw-cube-row .cube-blue,
.gpw-cube-row .cube-blue::before,
.gpw-cube-row .cube-blue::after {
	background-color: #4ca8f0 !important;
	border-color: #0876cb !important;
}

/* Kumpulan kedua */
.gpw-cube-row .cube-red,
.gpw-cube-row .cube-red::before,
.gpw-cube-row .cube-red::after {
	background-color: #ffaaaa !important;
	border-color: #ff3030 !important;
}

/* Kawasan anak panah */
.gpw-arrows {
	width: 520px;
	height: 135px;
	position: relative;
}

/* Anak panah daripada kiri */
.gpw-arrows::before {
	content: "";

	position: absolute;
	top: 45px;
	left: 35px;

	width: 230px;
	height: 3px;

	background: var(--green);

	transform: rotate(30deg);
	transform-origin: left center;

	clip-path: polygon(
		0 25%,
		88% 25%,
		88% 0,
		100% 50%,
		88% 100%,
		88% 75%,
		0 75%
	);
}

/* Anak panah daripada kanan */
.gpw-arrows::after {
	content: "";

	position: absolute;
	top: 45px;
	right: 35px;

	width: 230px;
	height: 3px;

	background: var(--green);

	transform: rotate(150deg);
	transform-origin: right center;

	clip-path: polygon(
		0 25%,
		88% 25%,
		88% 0,
		100% 50%,
		88% 100%,
		88% 75%,
		0 75%
	);
}

/* Whole di bawah */
.gpw-whole {
	width: min(500px, 85%);

	display: flex;
	flex-direction: column;
	align-items: center;

	text-align: center;
}

.gpw-whole .whole-box {
	width: 100%;
}

.gpw-whole h2 {
	margin-top: 0.75rem;
}

/* Rumusan */
.gpw-summary {
	margin-top: 1rem;
	padding: 0.75rem 2rem;

	text-align: center;

	background: #dcfce7;
	border: 3px solid #58cc02;
	border-radius: 12px;
}

.gpw-summary h2 {
	margin: 0;
	color: #249b48;
}

.gpw-summary p {
	margin: 0.4rem 0 0;
	font-weight: bold;
}

.gpw-part,
.gpw-arrows,
.gpw-whole,
.gpw-summary {
	animation: gpwShow 0.4s ease;
}

@keyframes gpwShow {
	from {
		opacity: 0;
		transform: translateY(12px);
	}

	to {
		opacity: 1;
		transform: translateY(0);
	}
}

@media (max-width: 520px) {
	.gpw-wrapper {
		min-height: 380px;
	}

	.gpw-parts {
		gap: 1rem;
	}

	.gpw-box {
		min-height: 90px;
		padding: 0.75rem;
	}

	.gpw-cube-row .cube {
		scale: 0.6;
		margin-inline: -14px;
	}

	.gpw-arrows {
		width: 300px;
		height: 90px;
	}

	.gpw-arrows::before,
	.gpw-arrows::after {
		width: 135px;
		top: 30px;
	}

	.gpw-arrows::before {
		left: 15px;
	}

	.gpw-arrows::after {
		right: 15px;
	}

	.gpw-summary {
		padding: 0.6rem 1rem;
	}
}
	</style>
</head>

<body>
	<div class="container">
		<main>
			<header>
				<div>
					<a href="./index.html">
						<p class="x">x</p>
					</a>
					<div class="barContainer">
						<p class="text-bar">1/10 Questions</p>
						<div class="bar">
							<div class="barFill"></div>
						</div>
					</div>
				</div>

			</header>

			<section id="main">

				<div class="dialogContainer">
					<div class="icon"></div>
					<div class="dialog">
						<p></p>
					</div>
				</div>

				<div class="contentContainer">


				</div>

			</section>

			<footer>
				<div class="textContainer textBetul">
					<h2 class="hidden">BETUL</h2>
					<p class="hidden textFooter"></p>
				</div>
				<div class="btnContainer grid-2">
					<button class="btnContinue soft-box hidden">CONTINUE</button>
					<button class="btnCheck soft-box hidden">CHECK</button>
					<button class="btnBack soft-box">BACK</button>
					<button class="btnNext soft-box">NEXT</button>
				</div>
			</footer>
		</main>
	</div>

	<script type="module">
		import { json } from "../../src/js/data/lessonDataGabungPartWhole.js"
		import { runComponents } from "../../src/js/core/componentRunner.js"
		runComponents(json)
	</script>

</body>

</html>
